global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: dailyops-gateway
    static_configs:
      - targets: ["gateway:9090"]

  - job_name: n8n
    metrics_path: /metrics
    static_configs:
      - targets: ["n8n:5678"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
