name: dailyops

x-n8n-env: &n8n-env
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-dailyops-dev-encryption-key-change-me}
  GENERIC_TIMEZONE: UTC
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_RUNNERS_ENABLED: "true"
  N8N_SECURE_COOKIE: "false"
  N8N_HOST: localhost
  N8N_PORT: "5678"
  N8N_PROTOCOL: http
  WEBHOOK_URL: http://localhost:5678/
  AGENT_SERVICE_URL: http://agent-service:8000
  DATABASE_URL: postgres://dailyops:dailyops@postgres:5432/dailyops
  # Cloudflare Workers AI — read in n8n expressions via $env (visible LLM node)
  CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
  CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
  CLOUDFLARE_MODEL: ${CLOUDFLARE_MODEL:-@cf/meta/llama-3.1-8b-instruct}

services:
  # ------------------------------------------------------- source of truth
  postgres:
    image: postgres:16-alpine
    container_name: dailyops-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dailyops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dailyops}
      POSTGRES_DB: ${POSTGRES_DB:-dailyops}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-dailyops}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # ------------------------------------------------- agent-service (brain)
  # Reasoning only: RAG + read-only tools + LLM + Policy Engine.
  # Exposes POST /agent/decide. Never writes to target systems.
  agent-service:
    build: ./agent-service
    container_name: dailyops-agent
    environment:
      DATABASE_URL: postgres://dailyops:dailyops@postgres:5432/dailyops
      POLICY_FILE: /app/src/guardrails/policies.yaml
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_MODEL: ${CLOUDFLARE_MODEL:-@cf/meta/llama-3.1-8b-instruct}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  # --------------------------------------------------------------- n8n
  # Orchestration only: trigger, fetch, normalize, call agent-service,
  # route by action_type, execute, verify. No prompts, no business rules.
  n8n-init:
    image: n8nio/n8n:latest
    container_name: dailyops-n8n-init
    entrypoint: ["/bin/sh", "/init.sh"]
    volumes:
      - ./infra/n8n/init.sh:/init.sh:ro
      - ./n8n/workflows:/workflows:ro
      - n8n_data:/home/node/.n8n
    environment:
      <<: *n8n-env
    restart: "no"

  n8n:
    image: n8nio/n8n:latest
    container_name: dailyops-n8n
    environment:
      <<: *n8n-env
      N8N_METRICS: "true"
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      n8n-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12

  # ------------------------------------------------------ observability
  prometheus:
    image: prom/prometheus:latest
    container_name: dailyops-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090" # host 9091 to avoid clashing with other dev services
    depends_on:
      - agent-service
      - n8n

  grafana:
    image: grafana/grafana:latest
    container_name: dailyops-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000" # host 3001 (3000 is often taken by other dev services)
    depends_on:
      - prometheus

volumes:
  n8n_data:
  pgdata:
  prometheus_data:
  grafana_data:
