global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: agent-service
    static_configs:
      - targets: ["agent-service:8000"]

  - job_name: n8n
    metrics_path: /metrics
    static_configs:
      - targets: ["n8n:5678"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres:5432"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
