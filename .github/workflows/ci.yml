name: DailyOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/gateway/package-lock.json

      - name: Install gateway dependencies
        run: npm ci
        working-directory: services/gateway

      - name: Syntax-check all JS sources
        run: |
          for f in services/gateway/src/*.js services/mock-k8s/index.js services/simulator/*.js; do
            node --check "$f"
          done

      - name: Validate docker-compose config
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Validate workflow JSON + connection integrity
        run: node scripts/validate-workflows.js

      - name: Validate Grafana dashboard JSON
        run: node -e "JSON.parse(require('fs').readFileSync('infra/grafana/dashboards/dailyops.json')); console.log('dashboard OK')"

  integration:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Boot full stack
        run: |
          cp .env.example .env
          docker compose up -d
          chmod +x infra/n8n/init.sh

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9090/health >/dev/null && curl -sf http://localhost:5678/healthz >/dev/null && break
            sleep 5
          done

      - name: Publish a monitoring alert + verify it fans out
        run: |
          docker compose up -d --build
          sleep 5
          curl -s -X POST http://localhost:9090/publish \
            -H 'content-type: application/json' \
            -d '{"event_type":"service.alert","source":"prometheus","severity":"critical","service":"api","event_id":"ci-fanout-1","timestamp":"2026-09-05T00:00:00Z","payload":{"pod":"api-7d9f","namespace":"production","remediation":"restart_pod"}}'
          sleep 8
          METRICS=$(curl -s http://localhost:9090/metrics)
          echo "$METRICS" | grep -q 'dailyops_events_received_total{source="prometheus",event_type="service.alert"}' && echo "RECEIVED_OK"
          DISPATCHED=$(echo "$METRICS" | grep '^dailyops_events_dispatched_total' | awk '{s+=$2} END {print s+0}')
          echo "total dispatched=$DISPATCHED"
          test "$DISPATCHED" -ge 3

      - name: Dedup test (50 identical alerts -> 1 per queue)
        run: |
          for i in $(seq 1 50); do
            curl -s -X POST http://localhost:9090/publish -H 'content-type: application/json' \
              -d "{\"event_type\":\"service.alert\",\"source\":\"prometheus\",\"severity\":\"critical\",\"service\":\"api\",\"event_id\":\"dedup-$i\",\"dedup_key\":\"ci:single-key\",\"timestamp\":\"2026-09-05T00:00:00Z\",\"payload\":{\"pod\":\"api-7d9f\"}}" >/dev/null
          done
          sleep 5
          METRICS=$(curl -s http://localhost:9090/metrics)
          DEDUP=$(echo "$METRICS" | grep '^dailyops_events_deduplicated_total ' | awk '{print $2+0}')
          echo "deduplicated=$DEDUP (expect >= 47)"
          test "$DEDUP" -ge 47

      - name: Idempotency test (resend same event_id)
        run: |
          for i in 1 2 3; do
            curl -s -X POST http://localhost:9090/publish -H 'content-type: application/json' \
              -d '{"event_type":"task.completed","source":"hermes","event_id":"idem-same","timestamp":"2026-09-05T00:00:00Z","payload":{}}' >/dev/null
          done
          sleep 3
          METRICS=$(curl -s http://localhost:9090/metrics)
          ID=$(echo "$METRICS" | grep '^dailyops_events_idempotent_skipped_total ' | awk '{print $2+0}')
          echo "idempotent_skipped=$ID (expect >= 2)"
          test "$ID" -ge 2

      - name: Teardown
        if: always()
        run: docker compose down -v
