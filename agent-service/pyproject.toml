[project]
name = "dailyops-agent-service"
version = "0.4.0"
description = "DailyOps agent-service: reasoning + proposal only. No writes to target systems."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]",
    "pydantic>=2.11",
    "pyyaml>=6.0.2",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pyright>=1.1.300",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
executionEnvironments = [
  { root = "src" },
]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
